<script>
(function(){
"use strict";

/* ---------- config ---------- */
const PER_DAY = 7, SECS = 25, EPOCH = "2026-11-12", TZ = "America/New_York";
const TIERS = [
  {n:0, name:"Time's up", pts:0,   emoji:"⬛"},
  {n:1, name:"Pledge",           pts:10,  emoji:"⬜"},
  {n:2, name:"Brother",          pts:30,  emoji:"🟦"},
  {n:3, name:"E-Board",          pts:60,  emoji:"🟪"},
  {n:4, name:"Legacy",           pts:85,  emoji:"💜"},
  {n:5, name:"One in a TEPillion", pts:100, emoji:"👑"}
];
let MAX = PER_DAY * 100;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function todayET(){ return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function dayIndex(date){ return Math.round((Date.parse(date+"T12:00:00Z") - Date.parse(EPOCH+"T12:00:00Z")) / 864e5); }
function niceDate(date){ return new Date(date+"T12:00:00Z").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}); }
function addDays(date, n){ const d = new Date(date+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- matching ---------- */
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/&/g,"and").replace(/^\s*the\s+/,"").replace(/[^a-z0-9]/g,"");
}
function lev(a,b){
  const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
/* ---------- bank ---------- */
function splitTop(str){ // split on commas that aren't inside parentheses
  const out = []; let depth = 0, cur = "";
  for (const ch of str){ if (ch === "(") depth++; if (ch === ")") depth = Math.max(0, depth-1); if (ch === "," && !depth){ out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out.map(s => s.trim()).filter(Boolean);
}
function parseBank(txt){
  const qs = []; let cur = null;
  for (const raw of txt.split("\n")){
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    let m = line.match(/^\[(.+?)\]\s*(.+)$/);
    if (m){
      const parts = m[1].split("|").map(s => s.trim());
      cur = {cat:parts[0], prompt:m[2].trim(), names: parts.slice(1).some(f => /^names?$/i.test(f)), answers:[]};
      qs.push(cur); continue;
    }
    m = line.match(/^([1-5])\s*:\s*(.+)$/);
    if (m && cur){
      for (const item of splitTop(m[2])){
        const paren = [...item.matchAll(/\(([^)]*)\)/g)].flatMap(x => x[1].split("/")).map(s => s.trim()).filter(Boolean);
        const names = item.replace(/\([^)]*\)/g, "").split("/").map(s => s.trim()).filter(Boolean);
        if (!names.length) continue;
        const aliases = names.concat(paren).map(a => ({t:norm(a), part:false}));
        if (cur.names) for (const nm of names){
          const w = nm.split(/\s+/).filter(Boolean);
          if (w.length >= 2){ aliases.push({t:norm(w[0]), part:true}); aliases.push({t:norm(w[w.length-1]), part:true}); }
        }
        cur.answers.push({display:names[0], note:paren.join(" / "), aliases:aliases.filter(a => a.t), tier:+m[1]});
      }
    }
  }
  return qs.filter(q => q.answers.length);
}
const BANK = parseBank(document.getElementById("bank").textContent);

const permCache = {};
function perm(cycle){
  if (permCache[cycle]) return permCache[cycle];
  const r = mulberry32(hashStr("tepillion:" + cycle)), a = [...Array(BANK.length).keys()];
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return permCache[cycle] = a;
}
function questionsFor(date){
  const N = BANK.length; if (!N) return [];
  const k = Math.min(PER_DAY, N), out = [], seen = new Set();
  let pos = Math.max(0, dayIndex(date)) * PER_DAY;
  while (out.length < k){
    const idx = perm(Math.floor(pos / N))[pos % N]; pos++;
    if (!seen.has(idx)){ seen.add(idx); out.push(BANK[idx]); }
  }
  return out;
}

// Returns the matched answer, {amb:[...]} when a single name fits several people, or null.
function match(q, input){
  const n = norm(input); if (!n) return null;
  let bd = 99, hits = [];
  for (const a of q.answers) for (const al of a.aliases){
    const t = al.t; let d;
    if (t === n || t === n.replace(/s$/,"") || n === t.replace(/s$/,"") || t === n.replace(/es$/,"")) d = 0;
    else {
      const tol = t.length >= 5 ? 2 : t.length >= 3 ? 1 : 0;   // 1-2 letters of slack
      if (!tol || Math.abs(t.length - n.length) > tol) continue;
      d = lev(t, n); if (d > tol) continue;
    }
    if (d < bd){ bd = d; hits = [a]; } else if (d === bd && !hits.includes(a)) hits.push(a);
  }
  if (!hits.length) return null;
  if (hits.length === 1) return hits[0];
  return {amb: hits};
}

/* =====================================================================
   SIDE-SCROLLING FRAT HOUSE  (world 840x216, camera view 128x80, crisp)
   Outside -> Basketball Court -> House Dad Room -> Sweetheart Room ->
   Alumni Room -> (stairs down) Basement -> (stairs down) Rat Room
   ===================================================================== */
const VW = 128, VH = 80, WW = 840, WH = 216;
const PATH = [
  {s:0,   x:16,  y:69,  room:"Outside"},
  {s:60,  x:126, y:69,  room:"Basketball Court"},
  {s:160, x:258, y:69,  room:"House Dad Room"},
  {s:270, x:374, y:69,  room:"Sweetheart Room"},
  {s:380, x:490, y:69,  room:"Alumni Room"},
  {s:440, x:560, y:69},
  {s:490, x:612, y:133, room:"Basement"},
  {s:570, x:704, y:133},
  {s:600, x:748, y:197, room:"Rat Room"},
  {s:700, x:800, y:197}
];
const ROOMS = PATH.filter(p => p.room);
// Path is laid out on a 0..700 depth scale; a day's max score maps onto it.
const DEP = score => Math.max(0, Math.min(700, score * 700 / MAX));
function roomAt(score){ const d = DEP(score) + 1e-6; let r = ROOMS[0]; for (const p of ROOMS) if (d >= p.s) r = p; return r; }
function nextRoom(score){ const d = DEP(score) + 1e-6; return ROOMS.find(p => p.s > d) || null; }
const roomPts = p => Math.ceil(p.s * MAX / 700);
function posAt(score){
  score = DEP(score);
  for (let i=1;i<PATH.length;i++){
    const a = PATH[i-1], b = PATH[i];
    if (score <= b.s){ const t = (score - a.s) / (b.s - a.s || 1); return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
  }
  const l = PATH[PATH.length-1]; return {x:l.x, y:l.y};
}

const SPR = ["..HHH..",".HHHHH.",".HSSSH.","..SES..","..SSS..",".PPPPP.","SPPYPPS","S.PPP.S","..PPP..","..L.L..",".BB.BB."];

const SCN = { cv:null, ctx:null, score:0, cam:null, anim:null, raf:0, face:1, lastRoom:null, sparkleUntil:0, onDone:null };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function camTarget(p){ return { x: clamp(p.x - 54, 0, WW - VW), y: clamp(p.y - 58, 0, WH - VH) }; }

function sceneHTML(){
  return `<div class="scene">
    <canvas id="scn" width="${VW}" height="${VH}" aria-label="Pixel frat house: your run through the house"></canvas>
    <div class="ov-room" id="ovRoom"></div>
    <div class="ov-score" id="ovScore"></div>
    <div class="ov-banner" id="ovBanner"></div>
    <div class="ov-float" id="ovFloat"></div>
  </div><div class="where" id="where"></div>`;
}
function setWhere(score){
  const el = $("#where"); if (!el) return;
  const n = nextRoom(score);
  el.innerHTML = `<span class="here">DEPTH ${String(Math.round(score)).padStart(3,"0")}/${MAX}</span><span class="next">${n ? `NEXT: ${esc(n.room.toUpperCase())} @ ${roomPts(n)}` : "THE BOTTOM. YOU MADE IT."}</span>`;
}
function setOverlays(score){
  const r = $("#ovRoom"), s = $("#ovScore");
  if (r) r.textContent = roomAt(score).room.toUpperCase();
  if (s) s.textContent = String(Math.round(score)).padStart(3,"0");
}
function showBanner(room){
  const b = $("#ovBanner"); if (!b) return;
  b.innerHTML = `<small>ENTERING</small>${esc(room.toUpperCase())}`;
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
}
function showFloat(text, cls){
  const f = $("#ovFloat"); if (!f) return;
  f.textContent = text; f.className = "ov-float " + (cls||"");
  void f.offsetWidth; f.classList.add("show");
}

function drawFrame(now){
  const c = SCN.ctx, cv = SCN.cv;
  if (!WORLD) WORLD = buildWorld();
  // score along path
  let s = SCN.score, walking = false;
  if (SCN.anim){
    const a = SCN.anim, t = clamp((now - a.t0) / a.dur, 0, 1);
    if (t > 0) walking = t < 1;
    const e = t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
    s = a.from + (a.to - a.from) * e;
    SCN.score = s;
    const rm = roomAt(s).room;
    if (rm !== SCN.lastRoom){ SCN.lastRoom = rm; showBanner(rm); }
    setOverlays(s); setWhere(s);
    if (t >= 1){ SCN.anim = null; SCN.score = a.to; if (a.big) SCN.sparkleUntil = now + 1400; const cb = SCN.onDone; SCN.onDone = null; if (cb) cb(); }
  }
  const p = posAt(s), pa = posAt(s + 2);
  if (walking) SCN.face = (pa.x - p.x) < -0.01 ? -1 : 1;
  // camera
  const tgt = camTarget(p);
  if (!SCN.cam) SCN.cam = {x:tgt.x, y:tgt.y};
  SCN.cam.x += (tgt.x - SCN.cam.x) * 0.14; SCN.cam.y += (tgt.y - SCN.cam.y) * 0.14;
  const cx = Math.round(SCN.cam.x), cy = Math.round(SCN.cam.y);
  c.clearRect(0,0,VW,VH);
  c.drawImage(WORLD, cx, cy, VW, VH, 0, 0, VW, VH);
  const R = (col,x,y,w,h) => rect(c,col,Math.round(x-cx),Math.round(y-cy),w,h);
  const T = now/1000;
  const glow = (x,y,r,rgb,a) => { const gx=x-cx, gy=y-cy, g=c.createRadialGradient(gx,gy,0,gx,gy,r); g.addColorStop(0,`rgba(${rgb},${a})`); g.addColorStop(1,`rgba(${rgb},0)`); c.fillStyle=g; c.fillRect(gx-r,gy-r,r*2,r*2); };

  // ---- live props ----
  // porch light glow
  glow(108,41,14,"255,204,51",.35 + .08*Math.sin(T*5));
  // basketball bounce
  { const ph = (T*1.1) % 2, bx = 182 + (ph < 1 ? ph : 2-ph) * 24, by = 65 - Math.abs(Math.sin(T*5.2)) * 16;
    R("#ff8a2a",bx,by,4,4); R("#b8521a",bx+1.5,by,1,4); R("#b8521a",bx,by+1.5,4,1); R("rgba(0,0,0,.35)",bx,69,4,1); }
  // lamp glow + mug steam
  glow(297,46,22,"240,208,128",.32 + .05*Math.sin(T*2));
  for (let k=0;k<3;k++){ const ph = (T*0.8 + k/3) % 1; R("rgba(230,230,240,"+(0.8-ph*0.8)+")", 301 + Math.round(Math.sin(ph*9+k)*1.5), 56 - ph*10, 1, 1); }
  // floating hearts
  for (let k=0;k<4;k++){ const ph = (T*0.35 + k/4) % 1, hx = 372 + k*26 + Math.sin(T*2+k)*3, hy = 66 - ph*48;
    c.globalAlpha = ph < .8 ? 1 : (1-ph)*5; glyph(c, k%2 ? "#ff6a9a" : "#ffb0d0", HEART, Math.round(hx-cx), Math.round(hy-cy)); c.globalAlpha = 1; }
  // trophy twinkle
  [[538,29],[546,30],[542,43],[550,44]].forEach(([x,y],k) => { if (Math.sin(T*3+k*1.7) > .85){ R("#ffffff",x+1,y-1,1,1); R("#ffffff",x,y,1,1); R("#ffffff",x+2,y,1,1); } });
  // swinging bulb
  { const ang = Math.sin(T*1.6)*0.35, len = 14, bx = 656 + Math.sin(ang)*len, by = 82 + Math.cos(ang)*len;
    for (let i=0;i<len;i+=1) R("#22222a",656+Math.sin(ang)*i,82+Math.cos(ang)*i,1,1);
    glow(bx,by+2,26,"255,224,138",.38); R("#ffe08a",bx-1,by,3,3); R("#ffffff",bx,by,1,1); }
  // furnace flame flicker
  { const f = Math.random(); R(f>.5?"#ff8a2a":"#ffcc33",685,120,10,2); R("#ff5468",686+Math.floor(f*6),121,3,4); }
  // rats
  for (let k=0;k<2;k++){
    const span = 70, ph = ((T*(k?0.42:0.3)) + k*.5) % 2, dir = ph < 1 ? 1 : -1, rx = 752 + (ph < 1 ? ph : 2-ph) * span, ry = 195;
    const tail = dir > 0 ? -3 : 5;
    R("#6a6a72",rx,ry,5,3); R("#7a7a82",rx+1,ry-1,3,1); R("#8a8a92",dir>0?rx+4:rx,ry-1,1,1); R("#ff7a8a",dir>0?rx+5:rx-1,ry+1,1,1);
    R("#c88a90",rx+tail,ry+2,3,1); R("#111",dir>0?rx+4:rx,ry,1,1);
    if (Math.floor(T*8)%2) { R("#4a4a52",rx+1,ry+3,1,1); R("#4a4a52",rx+3,ry+3,1,1); }
  }
  // drip
  { const ph = (T*0.9) % 1; R("#8ab0c8",790,147 + ph*50,1,2); if (ph > .96) { R("#8ab0c8",788,197,1,1); R("#8ab0c8",792,197,1,1); } }

  // ---- sprite ----
  const sp = (walking && Math.floor(now/110)%2) ? SPR2 : SPR, h = sp.length;
  const bob = (!walking && Math.floor(now/500)%2) ? 1 : 0;
  const ox = Math.round(p.x - cx) - 3, oy = Math.round(p.y - cy) - h + 1 + bob;
  rect(c,"rgba(0,0,0,.45)",ox+1,Math.round(p.y-cy)+1,5,1);
  sp.forEach((row,j)=>{ for (let i=0;i<7;i++){ const ch = row[SCN.face<0 ? 6-i : i]; if (ch !== ".") rect(c, SPR_COL[ch], ox+i, oy+j, 1, 1); } });
  if (now < SCN.sparkleUntil){ for (let k=0;k<8;k++){ const a = T*6 + k*0.785, rr = 7 + Math.sin(T*10+k)*2; rect(c, k%2?"#ffcc33":"#ffffff", Math.round(ox+3+Math.cos(a)*rr), Math.round(oy+5+Math.sin(a)*rr), 1, 1); } }

  // ---- darkness: deeper = darker, flashlight around the brother ----
  const depth = clamp((p.y - 69) / 128, 0, 1);
  if (depth > 0.02){
    let dark = 0.45 + depth * 0.45;
    if (p.x > 744 && p.y > 160 && Math.random() < 0.04) dark = 0.92;
    const sx = p.x - cx, sy = p.y - cy - 6;
    const g = c.createRadialGradient(sx, sy, 8, sx, sy, 46);
    g.addColorStop(0, "rgba(5,3,15,0)"); g.addColorStop(1, `rgba(5,3,15,${dark})`);
    c.fillStyle = g; c.fillRect(0,0,VW,VH);

}
function sceneLoop(now){
  if (!SCN.cv || !document.body.contains(SCN.cv)) { SCN.raf = 0; return; }
  drawFrame(now);
  SCN.raf = requestAnimationFrame(sceneLoop);
}
// Mount the scene. If fromScore is given, the brother walks from there to score.
function mountScene(score, fromScore, opts){
  opts = opts || {};
  cancelAnimationFrame(SCN.raf);
  SCN.cv = $("#scn"); if (!SCN.cv) return;
  SCN.ctx = SCN.cv.getContext("2d"); SCN.ctx.imageSmoothingEnabled = false;
  const start = fromScore == null ? score : fromScore;
  SCN.score = start; SCN.anim = null; SCN.cam = null; SCN.lastRoom = roomAt(start).room; SCN.onDone = opts.onDone || null;
  setOverlays(start); setWhere(start);
  if (start !== score){
    const delay = 450, dur = Math.min(3200, 900 + (score - start) * 16);
    SCN.anim = { from:start, to:score, t0: performance.now() + delay, dur, big: !!opts.big };
    if (opts.floatText) setTimeout(() => showFloat(opts.floatText, opts.floatCls), 150);
  } else if (opts.floatText) showFloat(opts.floatText, opts.floatCls);
  SCN.raf = requestAnimationFrame(sceneLoop);
}

/* ---------- admin (for hosting outside Claude, e.g. GitHub Pages) ----------
   Visit yoursite/#admin once on your own phone/laptop to unlock the reset
   button and schedule view on that device. Visit #noadmin to lock it again. */
if (location.hash === "#admin"){ store.set("tepillion:admin", true); history.replaceState(null, "", location.pathname + location.search); }
if (location.hash === "#noadmin"){ store.set("tepillion:admin", false); history.replaceState(null, "", location.pathname + location.search); }
const ADMIN = store.get("tepillion:admin") === true;
const canAdmin = () => SH.isOwner === true || (!SH.user && ADMIN);

/* ---------- state ---------- */
const TODAY = todayET();
const NUM = Math.max(0, dayIndex(TODAY)) + 1;
const QS = questionsFor(TODAY);
MAX = Math.max(100, QS.length * 100);
const KEY = "tepillion:v1:" + TODAY;
let S = store.get(KEY) || {results:[], pending:null, done:false};
let timerRAF = null, phase = "home";

function total(st){ return (st.results||[]).reduce((s,r)=>s+(TIERS[r.tier]||TIERS[0]).pts,0); }
function save(){ store.set(KEY, S); }

/* ---------- shared (leaderboard) ---------- */
const SH = { db:null, user:null, me:null, plays:[], names:{}, status:"loading", canWrite:true, isOwner:null };

async function getClaude(){
  for (let i=0;i<40;i++){ if (window.claude && typeof window.claude.use === "function") return window.claude; await new Promise(r=>setTimeout(r,250)); }
  return null;
}
async function initShared(){
  const c = await getClaude();
  if (!c){ SH.status = "off"; refreshBoard(); return; }
  try {
    const [user, db] = await Promise.all([c.use("user"), c.use("db")]);
    SH.user = user; SH.db = db;
    if (user){ try { SH.isOwner = await user.isOwner(); } catch(e){} }
    if (!db || !user){ SH.status = "off"; refreshBoard(); rerenderOwnerBits(); return; }
    SH.me = await user.id();
    try { const cw = await user.can("data.write"); if (cw === false) SH.canWrite = false; } catch(e){}
    const timeout = setTimeout(()=>{ if (SH.status==="loading"){ SH.status="slow"; refreshBoard(); } }, 10000);
    db.collection("plays").onSnapshot(snap => {
      SH.plays = snap.docs.map(d => ({id:d.id, data:d.data()||{}}));
      if (!snap.metadata.fromCache) clearTimeout(timeout);
      SH.status = "on";
      adoptRemote(); resolveNames(); refreshBoard();
    }, () => { clearTimeout(timeout); SH.status = "off"; refreshBoard(); });
    rerenderOwnerBits();
  } catch(e){ SH.status = "off"; refreshBoard(); }
}
function rerenderOwnerBits(){
  if (location.hash === "#schedule") renderSchedule();
  else { const slot = $("#ownerSlot"); if (slot){ slot.innerHTML = ownerLink(); wireOwner(); } }
}
function todaysPlays(){
  return SH.plays.map(p => ({id:p.id, day:(p.data.days||{})[TODAY]})).filter(p => p.day && typeof p.day.score === "number");
}
function adoptRemote(){
  if (!SH.me || S.done || Date.now() < (SH.resetUntil||0)) return;
  const mine = SH.plays.find(p => p.id === SH.me);
  const day = mine && (mine.data.days||{})[TODAY];
  if (day && Array.isArray(day.tiers)){
    S = {done:true, pending:null, results: day.tiers.map((t,i)=>({tier:t, display:(day.answers||[])[i]||null, input:(day.inputs||[])[i]||"", tries:[]}))};
    save(); if (phase === "home") render();
  }
}
let savingShared = false;
async function saveShared(){
  if (!SH.db || !SH.me || !S.done || !SH.canWrite || savingShared) return;
  const mine = SH.plays.find(p => p.id === SH.me);
  if (mine && (mine.data.days||{})[TODAY]) return;
  savingShared = true;
  try {
    const ref = SH.db.doc("plays/" + SH.me);
    const snap = await ref.get();
    const days = Object.assign({}, snap.exists ? ((snap.data()||{}).days || {}) : {});
    days[TODAY] = { score: total(S), tiers: S.results.map(r=>r.tier), answers: S.results.map(r=>r.display||null), inputs: S.results.map(r=>(r.input||"").slice(0,60)), at: Date.now() };
    const trimmed = {}; Object.keys(days).sort().slice(-90).forEach(k => trimmed[k] = days[k]);
    await ref.set({ days: trimmed });
  } catch(e){ SH.canWrite = false; refreshBoard(); }
  savingShared = false;
}
let nameReq = false;
async function resolveNames(){
  if (!SH.user || nameReq) return;
  const ids = todaysPlays().map(p=>p.id).filter(id => !(id in SH.names));
  if (!ids.length) return;
  nameReq = true;
  try { const ps = await SH.user.profiles(ids); ids.forEach(id => SH.names[id] = (ps && ps[id] && ps[id].name) || ""); } catch(e){}
  nameReq = false; refreshBoard();
}
function boardHTML(){
  if (SH.status === "loading") return `<p class="muted">LOADING<span class="blink">_</span></p>`;
  if (SH.status === "off") return `<p class="muted small">The chapter leaderboard shows up when you open TEPillion signed in to Claude with access to this page. You can still play. Your run is saved on this device.</p>`;
  const rows = todaysPlays().sort((a,b)=>b.day.score-a.day.score || (a.day.at||0)-(b.day.at||0));
  let h = "";
  if (SH.status === "slow") h += `<p class="muted small">Can't reach the leaderboard right now. It may be out of date.</p>`;
  if (!rows.length) h += `<p class="muted small">Nobody's on the board yet today.${S.done ? "" : " Be first."}</p>`;
  else h += `<div>` + rows.slice(0,25).map((r,i) => {
    const nm = SH.names[r.id] || "A brother";
    const grid = (r.day.tiers||[]).map(t => (TIERS[t]||TIERS[0]).emoji).join("");
    return `<div class="brow ${r.id===SH.me?"me":""}"><span class="rank">${i+1}</span><span class="nm">${esc(nm)}${r.id===SH.me?" (you)":""}</span><span class="mini">${S.done?grid:""}</span><span class="sc">${r.day.score}</span></div>`;
  }).join("") + `</div>`;
  if (!SH.canWrite && S.done) h += `<p class="muted small" style="margin-top:8px">Your run is saved on this device, but your access can't post to the shared board. Ask the page owner to invite you as an Editor.</p>`;
  return h;
}
function refreshBoard(){
  const el = $("#board"); if (el) el.innerHTML = boardHTML();
  const bp = $("#boardPanel"); if (bp) bp.style.display = (SH.status === "on" || SH.status === "slow") ? "" : "none";
  if (phase === "res") renderMine();
  if (S.done) saveShared();
}
function othersSaid(i, display){
  if (!display) return null;
  const others = todaysPlays().filter(p => p.id !== SH.me);
  if (!others.length) return null;
  return {same: others.filter(p => (p.day.answers||[])[i] === display).length, of: others.length};
}

/* ---------- screens ---------- */
function tierChip(t){ const T = TIERS[t]||TIERS[0]; return `<span class="chip c${T.n}">${T.emoji} ${esc(T.name.toUpperCase())}</span>`; }
function ownerLink(){
  if (!canAdmin()) return "";
  const started = S.done || S.results.length || S.pending;
  return `<div style="text-align:center">${started ? `<button class="link" id="resetBtn" style="color:var(--gold)">↺ RESET MY RUN (OWNER ONLY)</button><br>` : ""}<button class="link" id="schedBtn">QUESTION BANK &amp; SCHEDULE</button></div>`;
}
function wireOwner(){
  const b = $("#schedBtn"); if (b) b.onclick = () => { location.hash = "schedule"; };
  const r = $("#resetBtn");
  if (r) r.onclick = () => {
    if (!r.dataset.armed){ r.dataset.armed = "1"; r.textContent = "TAP AGAIN TO WIPE TODAY'S RUN"; setTimeout(()=>{ if (r.isConnected){ delete r.dataset.armed; r.textContent = "↺ RESET MY RUN (OWNER ONLY)"; } }, 4000); return; }
    resetRun();
  };
}
async function resetRun(){
  cancelAnimationFrame(timerRAF);
  SH.resetUntil = Date.now() + 5000;
  S = {results:[], pending:null, done:false}; save();
  renderHome();
  if (SH.db && SH.me){
    try {
      const ref = SH.db.doc("plays/" + SH.me), snap = await ref.get();
      if (snap.exists){ const days = Object.assign({}, (snap.data()||{}).days || {}); delete days[TODAY]; await ref.set({days}); }
    } catch(e){}
  }
}

function renderHome(){
  phase = "home";
  const started = S.results.length > 0 || S.pending;
  $("#app").innerHTML = `
    <div class="panel flush pop">
      ${sceneHTML()}
      <div class="body">
        <div class="lbl">DAILY RUN #${NUM}</div>
        <h1>${QS.length} PROMPTS. ${SECS} SECONDS EACH. RARE ANSWERS TAKE YOU DEEPER INTO THE HOUSE.</h1>
        <p class="muted">Same prompts for every brother today. Guess as many times as you want until the clock runs out. Your first answer that's on the sheet locks in, and obvious ones barely move you. Run out of time and you get zero. A perfect ${MAX} takes you all the way down to the Rat Room.</p>
        <div class="tiers">${TIERS.slice(1).reverse().map(T=>`<div class="tier"><span class="chip c${T.n}">${T.emoji} ${esc(T.name.toUpperCase())}</span><span class="pts">+${T.pts}</span></div>`).join("")}</div>
        <div style="margin-top:18px">
          ${QS.length ? `<button class="full gold" id="go">${started ? "▶ CONTINUE" : "▶ PRESS START"}</button>` : `<p>No questions in the bank yet.</p>`}
        </div>
      </div>
    </div>
    <div class="panel" id="boardPanel" style="${SH.status==="on"||SH.status==="slow" ? "" : "display:none"}"><h2>★ TODAY'S BOARD</h2><div id="board">${boardHTML()}</div></div>
    <div id="ownerSlot">${ownerLink()}</div>`;
  const go = $("#go"); if (go) go.onclick = startOrResume;
  wireOwner();
  mountScene(total(S));
}

function startOrResume(){
  if (S.done) return renderResults();
  const i = S.results.length;
  if (S.pending && S.pending.idx === i){
    if (S.pending.deadline - Date.now() <= 0){ phase = "q"; finishQuestion("", null, true, S.pending.tries || []); return; }
    return renderQuestion(i, S.pending.deadline);
  }
  const deadline = Date.now() + SECS*1000;
  S.pending = {idx:i, deadline}; save();
  renderQuestion(i, deadline);
}

function renderQuestion(i, deadline){
  phase = "q";
  const q = QS[i];
  $("#app").innerHTML = `
    <div class="panel flush pop">
      <div class="hud"><span>Q ${i+1}/${QS.length}</span><span class="secs" id="secs">${SECS}</span><span class="score">${String(total(S)).padStart(3,"0")} PTS</span></div>
      ${sceneHTML()}
      <div class="body">
        <span class="cat">${esc(q.cat.toUpperCase())}</span>
        <div class="prompt">${esc(q.prompt)}</div>
        <div class="timer" id="timer"><b id="bar"></b></div>
        <form id="f" autocomplete="off">
          <div class="row">
            <input type="text" id="ans" placeholder="guess_" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="60">
            <button type="submit" class="gold">GO</button>
          </div>
        </form>
        <div class="nope" id="nope"></div>
        <div class="tries" id="tries"></div>
      </div>
    </div>`;
  mountScene(total(S));
  const inp = $("#ans"); setTimeout(()=>inp.focus(), 30);
  const tries = (S.pending && S.pending.tries) || [];
  const drawTries = () => { $("#tries").innerHTML = tries.map(x => `<span>${esc(x)}</span>`).join(""); };
  drawTries();
  const nope = (msg) => { const n = $("#nope"); n.textContent = msg; inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); };
  $("#f").onsubmit = e => {
    e.preventDefault();
    const v = inp.value.trim(); if (!v) return nope("");
    const hit = match(q, v);
    if (hit && hit.amb){ nope(`MORE THAN ONE ${q.names ? "PERSON" : "MATCH"}. BE MORE SPECIFIC!`); inp.select(); return; }
    if (hit) return finishQuestion(v, hit, false, tries.slice());
    if (tries.some(x => norm(x) === norm(v))) { nope("ALREADY TRIED THAT"); inp.select(); return; }
    tries.push(v.slice(0,40)); if (S.pending){ S.pending.tries = tries; save(); }
    drawTries(); inp.value = ""; nope("✗ NOT ON THE SHEET. KEEP GUESSING!");
    showFloat("✗", "bad");
  };
  const bar = $("#bar"), secs = $("#secs"), tm = $("#timer");
  cancelAnimationFrame(timerRAF);
  const tick = () => {
    const left = Math.max(0, deadline - Date.now());
    bar.style.width = (Math.ceil(left/(SECS*1000)*40)/40*100) + "%";
    secs.textContent = String(Math.ceil(left/1000)).padStart(2,"0");
    tm.classList.toggle("low", left < 6000);
    if (left <= 0){ const v = inp.value.trim(), m0 = v ? match(q, v) : null, hit = m0 && !m0.amb ? m0 : null; finishQuestion(hit ? v : "", hit, !hit, tries.slice()); return; }
    timerRAF = requestAnimationFrame(tick);
  };
  timerRAF = requestAnimationFrame(tick);
}

function finishQuestion(input, hit, timedOut, tries){
  cancelAnimationFrame(timerRAF);
  if (phase !== "q") return;
  const before = total(S);
  const i = S.results.length;
  const r = {input, display: hit ? hit.display : null, tier: hit ? hit.tier : 0, timedOut, tries: (tries||[]).slice(0,30)};
  S.results.push(r); S.pending = null;
  if (S.results.length >= QS.length) S.done = true;
  save();
  if (S.done) saveShared();
  renderFeedback(i, r, before);
}

function renderFeedback(i, r, before){
  phase = "fb";
  const q = QS[i], T = TIERS[r.tier];
  const rare = q.answers.filter(a => a.tier >= 4 && a.display !== r.display).slice(0,4).map(a=>a.display);
  const last = i === QS.length - 1;
  let msg;
  if (r.tier) msg = `<div class="answer">${esc(r.display)}</div>${r.input && norm(r.input)!==norm(r.display) ? `<p class="muted small">You typed “${esc(r.input)}”</p>` : ""}`;
  else msg = `<p class="muted">TIME'S UP!</p>`;
  const nt = (r.tries||[]).length;
  if (nt) msg += `<p class="muted small">${nt} miss${nt===1?"":"es"} first: ${r.tries.map(esc).join(", ")}</p>`;
  $("#app").innerHTML = `
    <div class="panel flush pop">
      <div class="hud"><span>Q ${i+1}/${QS.length}</span><span></span><span class="score">${String(total(S)).padStart(3,"0")} PTS</span></div>
      ${sceneHTML()}
      <div class="body">
        <span class="cat">${esc(q.cat.toUpperCase())}</span>
        <p class="muted" style="margin-bottom:6px">${esc(q.prompt)}</p>
        <div class="verdict">
          ${tierChip(r.tier)}
          <div class="gain">+${T.pts}</div>
          ${msg}
        </div>
        ${rare.length ? `<p class="sheet">Deep cuts on the sheet: ${rare.map(esc).join(" · ")}</p>` : ""}
        <button class="full gold" id="next" style="margin-top:14px">${last ? "▶ SEE RESULTS" : "▶ NEXT PROMPT"}</button>
      </div>
    </div>`;
  mountScene(total(S), before, { floatText: r.tier ? "+" + T.pts : "TIME'S UP", floatCls: r.tier ? "" : "bad", big: r.tier >= 4 });
  const nx = $("#next"); nx.focus();
  nx.onclick = () => last ? renderResults() : startOrResume();
}

function shareText(){
  const sc = total(S);
  return `TEPillion #${NUM} · ${sc}/${MAX} · made it to the ${roomAt(sc).room}\n` + S.results.map(r => TIERS[r.tier].emoji).join("");
}

      </div>
    </div>
    <div class="panel" id="boardPanel" style="${SH.status==="on"||SH.status==="slow" ? "" : "display:none"}"><h2>★ TODAY'S BOARD</h2><div id="board">${boardHTML()}</div></div>
    <div class="panel"><h2>YOUR ANSWERS</h2><div id="mine"></div></div>
    <div id="ownerSlot">${ownerLink()}</div>`;
  mountScene(sc);
  renderMine();
  $("#copy").onclick = async () => {
    const t = shareText();
    try { await navigator.clipboard.writeText(t); $("#copy").textContent = "COPIED!"; }
    catch(e){ const ta = $("#shareTxt"); ta.value = t; ta.style.display = "block"; ta.focus(); ta.select(); $("#copy").textContent = "COPY THE TEXT BELOW"; }
  };
  wireOwner();
  saveShared();
}
function renderMine(){
  const el = $("#mine"); if (!el) return;
  el.innerHTML = S.results.map((r,i) => {
    const q = QS[i]; if (!q) return "";
    const o = othersSaid(i, r.display);
    const nt = (r.tries||[]).length;
    const ans = (r.display ? esc(r.display) : `<span class="muted">Time's up</span>`) + (nt ? `<span class="muted small"> · ${nt} miss${nt===1?"":"es"}</span>` : "");
    const also = o ? `<div class="also">${o.same ? `${o.same} of ${o.of} other brother${o.of===1?"":"s"} said this too` : `Nobody else said this`}</div>` : "";
    const open = OPEN.has(i);
    const sheet = open ? `<div class="fullsheet">${[5,4,3,2,1].map(tn => {
        const list = q.answers.filter(a => a.tier === tn); if (!list.length) return "";
        return `<div class="ftier">${tierChip(tn)}<div class="fans">${list.map(a => a.display === r.display ? `<b class="mine">★ ${esc(a.display)}${a.note ? ` (${esc(a.note)})` : ""}</b>` : `<span>${esc(a.display)}${a.note ? ` <em class="muted">(${esc(a.note)})</em>` : ""}</span>`).join("")}</div></div>`;
      }).join("")}</div>` : "";
    return `<div class="res click ${open?"open":""}" data-i="${i}" role="button" tabindex="0" aria-expanded="${open}">
      <div class="grow"><div class="q">${esc(q.cat)} · ${esc(q.prompt)}</div><div class="a">${ans}</div>${also}
      <div class="toggle">${open ? "▲ HIDE ANSWERS" : "▼ SEE ALL ANSWERS"}</div></div>${tierChip(r.tier)}</div>${sheet}`;
  }).join("");
  el.querySelectorAll(".res.click").forEach(row => {
    const go = () => { const i = +row.dataset.i; OPEN.has(i) ? OPEN.delete(i) : OPEN.add(i); renderMine(); };
    row.onclick = go;
    row.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } };
  });
}
const OPEN = new Set();

function renderSchedule(){
  phase = "sched";
  if (!canAdmin()){ location.hash = ""; return; }
  const N = BANK.length, days = N ? Math.floor(N / PER_DAY) : 0;
  let h = `<div class="panel"><h2>QUESTION BANK</h2>
    <p>${N} question${N===1?"":"s"} across ${new Set(BANK.map(q=>q.cat)).size} categories. That's ${days} day${days===1?"":"s"} of fresh prompts before any repeat.</p>
    <p class="muted small">Only you, the page owner, can see this view. It shows the next 14 days so you can check the rotation.</p>
    <button class="ghost" id="back">◀ BACK</button></div><div class="panel"><h2>UPCOMING</h2>`;
  for (let d=0; d<14; d++){
    const date = addDays(TODAY, d), qs = questionsFor(date);
    h += `<div class="sched"><span style="color:var(--gold)">#${Math.max(0,dayIndex(date))+1} · ${esc(niceDate(date))}</span>${d===0?" (today)":""}<div class="muted small">${qs.map(q=>`[${esc(q.cat)}] ${esc(q.prompt)}`).join("<br>")}</div></div>`;
  }
  $("#app").innerHTML = h + `</div>`;
  $("#back").onclick = () => { location.hash = ""; };
}

function render(){ S.done ? renderResults() : renderHome(); }
function route(){ if (location.hash === "#schedule") renderSchedule(); else if (phase === "sched" || phase === "home" || phase === "res") render(); }
window.addEventListener("hashchange", route);

$("#hdrDate").innerHTML = esc(niceDate(TODAY).toUpperCase()) + "<br>RUN #" + NUM;
if (location.hash === "#schedule") renderSchedule(); else render();
initShared();
})();
</script>
</body>
</html>
